<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>已是繁體中文的頁面</title>
    <style>
        body { font-family: Georgia, serif; margin: 0; padding: 20px; line-height: 1.8; }
        .container { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
        h1 { border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; }
        p { margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>這是一個繁體中文的測試頁面</h1>
        <p>當目標語言設為繁體中文時，此頁面不應被翻譯。因為頁面已經是繁體中文。</p>
        <p>擴充功能應該自動偵測到頁面語言與目標語言相同，並抑制翻譯行為。</p>
        <p>這是母語抑制功能的驗證場景。</p>
    </div>
</body>
</html>
